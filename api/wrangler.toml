name = "api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
# Served only at the custom domain; workers.dev and preview URLs are off. The web app calls this host (web/src/lib/api.ts).
workers_dev = false
preview_urls = false
routes = [{ pattern = "gitlore-api.siteworks.uk", custom_domain = true }]

[observability]
enabled = true

[vars]
GEMINI_MODEL = "gemini-3.6-flash"
MAX_CONTEXT_CHARS = "16000"
